services:
  db:
    image: mariadb:10.4
    container_name: ucaplanner_db
    restart: unless-stopped
    environment:
      # Permite root con contraseña vacía (tal como espera _mysql_db.py)
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ucaplanner_base
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # El dump se importa automaticamente la primera vez que arranca el contenedor
      - ./doc/ucaplanner_base.sql:/docker-entrypoint-initdb.d/01_ucaplanner_base.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
