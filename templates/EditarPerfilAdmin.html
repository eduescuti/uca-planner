<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Para que se active el modo responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Relaciona o enlaza este archivo html con el 03.css-->
    <link rel="stylesheet" href="../static/css/EditarPerfil.css">
    <link rel="stylesheet" href="../static/css/theme.css">
    <title>UCA Planner | Administrador</title>
</head>

<body>
    <div class="header">
        <h1>UCA Planner</h1>
    </div>

    <div class="topnav">
        <a href="/home">Información</a>
        <a href="/gestion_inscripciones">Inscripciones</a>
        <a href="/cursos">Cursos</a>
        <a href="/comisiones">Comisiones</a>
        <a href="/materias">Materias</a>

        <div class="topnav_right">
            <a href="/perfil">Administrador</a>
        </div>
    </div>

    <div class="contenedor">
        <h1>Editar Perfil</h1>

        <form onsubmit="return validarDatos()" action="/_editar_perfil" method="get">

            <label for="usuario">Cambiar Usuario:</label>
            <input type="text" name="usuario" id="usuario" placeholder="@{{param['usuario']}}"
                onfocusout="validarUsuario()">
            <p class="error" id="error usuario"></p>

            <label for="mail">Cambiar Mail</label>
            <input type="email" id="mail" name="email" placeholder="{{param['email']}}." onfocusout="validarMail()">
            <p class="error" id="error mail"></p>

            <label for="contrasena">Cambiar Contraseña</label>
            <input type="password" id="contra" name="contraseña" placeholder="Ingrese una Nueva Contraseña.."
                onfocusout="validarContra()">
            <p class="error" id="error contra"></p>

            <p class="error" id="error incompleto"></p>

            <input type="submit" value="Guardar Cambios">

        </form>
    </div>


    <script language="javascript" type="text/javascript" src="../static/js/EditarPerfil.js"></script>

    <!-- Motion (motion.dev) + micro-interacciones UCA Planner -->
    <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.js"></script>
    <script src="../static/js/animations.js"></script>
</body>

</html>
